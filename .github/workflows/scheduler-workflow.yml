name: Scheduler Workflow

on:
  schedule:
    # Se ejecuta todos los días a las 23:59 (UTC)
    - cron: '59 23 * * *'
  # Permite ejecutar manualmente desde Actions
  workflow_dispatch:

jobs:
  invoke-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: validate execution
        run: echo "Ejecutando workflow programado"
  call-another-workflow:
    needs: invoke-workflow
    uses: ./.github/workflows/another-workflow.yml
